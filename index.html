<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>IDEA — Vintage Books</title>
    <link rel="preload" href="fonts/Unica77LL-Regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/frame.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="phone" aria-busy="true">
      <div class="asset-loader" id="asset-loader" role="status" aria-live="polite">
        <p class="t" id="asset-loader-status">Loading images…</p>
        <progress id="asset-progress" max="28" value="0" aria-label="Loading images"></progress>
        <p class="t" id="asset-loader-error" hidden>Some images could not be loaded.</p>
        <button class="t" id="asset-retry" type="button" hidden>Retry loading</button>
      </div>
      <section class="view catalog" id="catalog" aria-label="Book catalog" inert>
        <header class="header header--catalog">
          <h1 class="sr-only" tabindex="-1">IDEA book catalog</h1>
          <div class="topbar">
            <a class="t" href="#catalog">IDEA</a>
            <span class="t cart">Cart (0)</span>
          </div>
          <nav class="nav" aria-label="Main navigation">
            <span class="t" aria-current="page">Catalog</span>
            <span class="t muted">Search</span>
            <span class="t muted">About</span>
          </nav>
        </header>
        <div class="grid" id="grid" aria-label="Books"></div>
        <footer class="footer">
          <p class="t">IDEA Books Ltd. Company no. 07963213<br />VAT Reg No. 912120776</p>
        </footer>
      </section>

      <section class="choice" id="choice" aria-labelledby="choice-title" hidden inert>
        <header class="choice__header">
          <div class="topbar">
            <a class="t" href="#catalog">IDEA</a>
            <span class="t cart">Cart (0)</span>
          </div>
          <h1 class="t choice__title" id="choice-title" tabindex="-1">Photo Nº 194 – Novembre 1983</h1>
        </header>
        <div class="choice__grid">
          <button class="choice__card" type="button" data-choice="new">
            <img src="assets/choice/photo-new.jpg" alt="Photo Nº 194 – Novembre 1983, new condition" width="700" height="1051">
            <span class="choice__info">
              <span class="t">Buy new</span>
              <span class="t muted price">£95.00</span>
            </span>
          </button>
          <button class="choice__card" type="button" data-choice="vintage">
            <img src="assets/choice/photo-used.jpg" alt="Photo Nº 194 – Novembre 1983, used condition with visible wear" width="700" height="1051">
            <span class="choice__info">
              <span class="t">Buy used</span>
              <span class="t muted price">From 95.00£ to 25.00£</span>
            </span>
          </button>
        </div>
      </section>

      <section class="view product" id="product" aria-labelledby="product-title" hidden inert>
        <header class="header header--product">
          <div class="topbar">
            <a class="t" href="#catalog">IDEA</a>
            <span class="t cart">Cart (0)</span>
          </div>
          <h1 class="t product__title" id="product-title" tabindex="-1">Photo Nº 194 – Novembre 1983</h1>
          <p class="t product__feedback" id="detail-feedback" aria-live="polite" aria-atomic="true"></p>
        </header>
        <div class="slider" id="slider" aria-label="Book photos"></div>
        <div class="loupe" id="loupe" aria-hidden="true" hidden></div>
        <div class="found" id="found" aria-label="Details you found"></div>
        <div class="recap" id="recap">
          <div class="recap__track" id="recap-track">
            <div class="recap__circles" id="recap-circles" aria-hidden="true"></div>
            <div class="recap__end" id="checkout-status" aria-live="polite">
              <span class="t" id="end-label">Added to Cart</span>
              <span class="t muted end__price" id="end-price">£95.00</span>
            </div>
          </div>
        </div>

        <p class="t product__amount" id="amount" aria-live="polite">£95.00</p>
        <button class="t product__add" id="product-add" type="button">Add to cart</button>
        <p class="t product__counter" id="counter" aria-live="polite">1/7</p>
      </section>
    </main>

    <script src="js/frame.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
