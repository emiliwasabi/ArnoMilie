<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>IDEA — Vintage Books</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/frame.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="phone">
      <section class="view catalog" id="catalog" aria-label="Book catalog">
        <header class="header header--catalog">
          <h1 class="sr-only" tabindex="-1">IDEA book catalog</h1>
          <div class="topbar">
            <a class="t" href="#catalog">IDEA</a>
            <span class="t cart">Cart (0)</span>
          </div>
          <nav class="nav" aria-label="Main navigation">
            <span class="t" aria-current="page">Catalog</span>
            <span class="t muted">Search</span>
            <span class="t muted">About</span>
          </nav>
        </header>
        <div class="grid" id="grid" aria-label="Books"></div>
        <footer class="footer">
          <p class="t">IDEA Books Ltd. Company no. 07963213<br />VAT Reg No. 912120776</p>
        </footer>
      </section>

      <div class="choice" id="choice" role="group" aria-label="Choose book condition" hidden>
        <div class="choice__band">
          <button class="choice__btn" type="button" data-choice="new">
            <span class="t">Buy new</span>
            <span class="t muted price">£95.00</span>
          </button>
          <button class="choice__btn" type="button" data-choice="vintage">
            <span class="t">Buy used</span>
            <span class="t muted price">£25.00</span>
          </button>
        </div>
      </div>

      <section class="view product" id="product" aria-labelledby="product-title" hidden>
        <header class="header header--product">
          <div class="topbar">
            <a class="t" href="#catalog">IDEA</a>
            <span class="t cart">Cart (0)</span>
          </div>
          <h1 class="t product__title" id="product-title" tabindex="-1">Photo November 1983 N194</h1>
        </header>
        <div class="slider" id="slider" aria-label="Book photos"></div>
        <div class="loupe" id="loupe" aria-hidden="true" hidden></div>
        <div class="found" id="found" aria-label="Details you found"></div>

        <div class="recap" id="recap">
          <div class="recap__circles" id="recap-circles" aria-hidden="true"></div>
          <button class="recap__end" id="add" type="button">
            <span class="t">Add to cart</span>
            <span class="t muted end__price" id="end-price">£95.00</span>
          </button>
        </div>

        <button class="t product__amount" id="amount" type="button" aria-live="polite">£95.00</button>
        <p class="t product__counter" id="counter" aria-live="polite">1/7</p>
      </section>
    </main>

    <script src="js/frame.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
