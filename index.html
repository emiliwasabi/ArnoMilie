<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>IDEA — Vintage Books</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/frame.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="phone">
      <section class="view catalog" id="catalog" aria-label="Book catalog">
        <header class="header header--catalog">
          <div class="topbar">
            <a class="t" href="#catalog">IDEA</a>
            <span class="t cart">Cart (0)</span>
          </div>
          <nav class="nav" aria-label="Main navigation">
            <span class="t" aria-current="page">Catalog</span>
            <span class="t muted">Search</span>
            <span class="t muted">About</span>
          </nav>
        </header>
        <div class="grid" id="grid" aria-label="Books"></div>
        <footer class="footer">
          <p class="t">IDEA Books Ltd. Company no. 07963213<br />VAT Reg No. 912120776</p>
        </footer>
      </section>

      <div class="choice" id="choice" hidden>
        <div class="choice__band" role="group" aria-label="Choose book condition">
          <button class="choice__btn" type="button" data-choice="new">
            <span class="t">Buy new</span><span class="t muted price">£95.00</span>
          </button>
          <button class="choice__btn" type="button" data-choice="vintage">
            <span class="t">Buy vintage</span><span class="t muted price">£25.00</span>
          </button>
        </div>
      </div>

      <section class="view product" id="product" aria-label="Book details" hidden>
        <header class="header header--product">
          <div class="topbar"><a class="t" href="#catalog">IDEA</a><span class="t cart">Cart (0)</span></div>
          <p class="t product__title">Photo November 1983 N194</p>
          <p class="t muted product__price">£25.00</p>
        </header>
        <div class="slider" id="slider" aria-label="Book photos"></div>
        <div class="loupe" id="loupe" aria-hidden="true" hidden></div>
        <div class="found" id="found" aria-label="Details you found"></div>
        <p class="t product__cta">Add to cart</p>
        <p class="t product__counter" id="counter" aria-live="polite">1/6</p>
      </section>
    </main>

    <script src="js/frame.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
